<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINHA TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff}
header{padding:12px;background:#111;display:flex;justify-content:space-between;align-items:center}
#playerWrap{width:100%;aspect-ratio:16/9;background:#000}
#playerWrap iframe{width:100%;height:100%;border:0}
#chList{display:flex;gap:10px;overflow-x:auto;padding:12px;background:#111}
.ch{min-width:80px;height:75px;background:#1f1f1f;border:2px solid #333;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.ch.active{border-color:#ff0033;background:#2a0a0f}
#info{padding:16px}
.btn{width:100%;margin-top:14px;background:#fff;color:#000;border:0;padding:14px;border-radius:12px;font-weight:800}
</style>
</head>
<body>
<header><h1>📺 MINHA TV</h1><span style="background:#ff0033;padding:4px 10px;border-radius:20px;font-size:11px">AO VIVO</span></header>
<div id="playerWrap">
<iframe id="player" src="https://www.youtube-nocookie.com/embed/SWhsS5g8Lqw?autoplay=1&mute=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>
<div id="chList">
<div class="ch active" onclick="trocar(this,'SWhsS5g8Lqw','Jovem Pan News - Ao Vivo')"><b>N</b><small>JP NEWS</small></div>
<div class="ch" onclick="trocar(this,'2O1h0lI1V0E','Record News')"><b>R</b><small>RECORD</small></div>
<div class="ch" onclick="trocar(this,'8fvMNKyq-4w','Band News')"><b>B</b><small>BAND</small></div>
<div class="ch" onclick="trocar(this,'6L6h2q0R0g0','TV Cultura')"><b>C</b><small>CULTURA</small></div>
<div class="ch" onclick="window.open('https://globoplay.globo.com/tv-globo/ao-vivo/','_blank')"><b>G</b><small>GLOBO</small></div>
</div>
<div id="info">
<h2 id="titulo">Jovem Pan News - Ao Vivo</h2>
<p style="color:#888;font-size:13px;margin-top:4px">Se aparecer "não disponível", clique em "Assistir no YouTube" dentro do player - é liberação do YouTube.</p>
<button class="btn" onclick="document.getElementById('playerWrap').requestFullscreen()">⛶ TELA CHEIA</button>
</div>
<script>
function trocar(el, videoId, nome){
 document.querySelectorAll('.ch').forEach(c=>c.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('titulo').innerText = nome;
 document.getElementById('playerWrap').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
}
</script>
</body>
</html>
